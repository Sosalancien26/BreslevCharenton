      theme: {
        extend: {
          colors: {
            cream: '#faf6ef',
            surface: '#fffdf8',
            ink: '#1a2238',
            'ink-soft': '#5a5a6e',
            gold: '#b8924a',
            'gold-dark': '#8a6c34',
            'gold-light': '#d4b878',
            bordeaux: '#7c2d3a',
            'bordeaux-dark': '#5a1f2a',
            amber: '#d97706',
            sage: '#5a7a4f',
            terracotta: '#c2410c',
            'red-alert': '#991b1b'
          },
          fontFamily: {

          }

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;background:#faf6ef;}
    body{font-family:'Inter',system-ui,sans-serif;color:#1a2238;-webkit-font-smoothing:antialiased;
      overscroll-behavior-y:contain;min-height:100vh;min-height:100dvh;}
    input,select,textarea,button{font-family:inherit;}
    h1,h2,h3{margin:0;}
    button{cursor:pointer;border:none;background:none;padding:0;}
    .font-serif{font-family:'Fraunces','Georgia',serif;}
    .no-scrollbar::-webkit-scrollbar{display:none;}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}

    /* ---- zones sûres iPhone ---- */
    .safe-top{padding-top:env(safe-area-inset-top);}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom);}

    /* ---- effets tactiles ---- */
    .tappable{transition:transform .12s ease-out,background-color .15s ease,box-shadow .2s ease,opacity .15s ease;}
    .tappable:active{transform:scale(.97);}

    /* ---- ombres chaudes ---- */
    .card-shadow{box-shadow:0 4px 20px rgba(184,146,74,.08),0 1px 3px rgba(124,45,58,.06);}

    /* ---- filigrane flamme ---- */
    .flame-watermark{position:fixed;z-index:0;pointer-events:none;right:-3vw;bottom:-4vh;
      width:46vw;max-width:560px;min-width:240px;height:auto;opacity:.10;filter:blur(1.5px);}
    @media(max-width:767px){.flame-watermark{width:64vw;right:-13vw;bottom:1vh;opacity:.085;}}
    .breathe{animation:breathe 6s ease-in-out infinite;transform-origin:50% 86%;}
    .flame-anim{animation:breathe 6s ease-in-out infinite;transform-origin:50% 86%;}
    .flicker{animation:flicker .95s ease-in-out infinite;transform-origin:50% 88%;}
    @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
    @keyframes flicker{0%,100%{opacity:1;transform:scale(1) rotate(-1deg);}
      25%{opacity:.82;transform:scale(1.05) rotate(1.2deg);}
      55%{opacity:.96;transform:scale(.97) rotate(-1.6deg);}
      80%{opacity:.78;transform:scale(1.03) rotate(1.6deg);}}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spin svg{animation:spin .8s linear infinite;}

    .flame-img{object-fit:contain;display:block;-webkit-user-drag:none;user-select:none;}
    .watermark-text{text-align:center;font-family:'Fraunces',serif;font-style:italic;
      color:#1a2238;opacity:.18;font-size:22px;padding:26px 0 14px;letter-spacing:.04em;}

    /* ---- en-tête ---- */
    .app-header{position:sticky;top:0;z-index:30;
      background:rgba(250,246,239,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(212,184,120,.4);}
    .header-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:10px;
      padding:9px 14px;min-height:58px;}
    @media(min-width:768px){.header-inner{padding:10px 22px;}}

    /* ---- contenu ---- */
    .app-main{position:relative;z-index:10;}
    .content-wrap{max-width:1140px;margin:0 auto;padding:18px 14px 0;}
    @media(min-width:768px){.content-wrap{padding:24px 22px 0;}}
    .app-main{padding-bottom:calc(86px + env(safe-area-inset-bottom));}
    @media(min-width:768px){.app-main{padding-bottom:36px;}}

    /* ---- carte ---- */
    .card{background:#fffdf8;border:1px solid rgba(212,184,120,.42);border-radius:1rem;
      padding:18px;box-shadow:0 4px 20px rgba(184,146,74,.08),0 1px 3px rgba(124,45,58,.06);
      transition:transform .2s ease-out,box-shadow .25s ease,border-color .2s ease;}
    @media(min-width:768px){.card{padding:22px;}}
    @media(hover:hover){
      .promesse-card:hover,.don-card:hover{transform:translateY(-2px);
        border-color:#d4b878;box-shadow:0 10px 28px rgba(184,146,74,.16),0 2px 6px rgba(124,45,58,.08);}
    }
    .promesse-card{cursor:pointer;}
    @media(min-width:768px){.promesse-card{cursor:default;}}
    .don-card{padding:14px 16px;}
    .cards-grid{display:grid;grid-template-columns:1fr;gap:14px;}
    @media(min-width:768px){.cards-grid{grid-template-columns:1fr 1fr;gap:16px;}}
    @media(min-width:1280px){.cards-grid{grid-template-columns:1fr 1fr 1fr;}}

    .montant-display{font-family:'Fraunces',serif;font-size:30px;font-weight:500;line-height:1.05;letter-spacing:.005em;}
    @media(min-width:768px){.montant-display{font-size:32px;}}
    .montant-input{font-family:'Fraunces',serif!important;font-size:30px!important;font-weight:500;}

    /* ---- KPI ---- */
    .kpi-grid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
      -ms-overflow-style:none;scrollbar-width:none;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px;}
    .kpi-grid::-webkit-scrollbar{display:none;}
    .kpi-card{scroll-snap-align:start;flex:0 0 78%;background:#fffdf8;
      border:1px solid rgba(212,184,120,.42);border-radius:1rem;padding:16px 18px;
      box-shadow:0 4px 20px rgba(184,146,74,.08),0 1px 3px rgba(124,45,58,.06);}
    .kpi-card-feature{border-color:rgba(217,119,6,.45);
      background:linear-gradient(160deg,#fffdf8 60%,rgba(217,119,6,.06));}
    @media(min-width:768px){
      .kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;overflow:visible;margin:0;padding:0;}
      .kpi-card{flex:none;}
    }
    .kpi-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
    .kpi-icon{width:36px;height:36px;border-radius:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .kpi-label{font-size:12.5px;font-weight:600;color:#5a5a6e;text-transform:uppercase;letter-spacing:.04em;}
    .kpi-value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.1;}
    @media(min-width:768px){.kpi-value{font-size:32px;}}
    .kpi-sub{font-size:12.5px;color:#5a5a6e;margin-top:3px;}

    /* ---- badges ---- */
    .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;
      padding:3px 9px;border-radius:999px;white-space:nowrap;}
    .badge-red{background:rgba(153,27,27,.12);color:#991b1b;}
    .badge-amber{background:rgba(217,119,6,.15);color:#b45309;}
    .badge-neutral{background:rgba(90,90,110,.12);color:#5a5a6e;}
    .badge-sage{background:rgba(90,122,79,.16);color:#4a6640;}
    .motif-chip{display:inline-block;background:rgba(184,146,74,.12);color:#8a6c34;
      font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;}

    /* ---- chips filtres ---- */
    .chip-row{display:flex;gap:8px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;
      padding-bottom:4px;margin-bottom:14px;}
    .chip-row::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;padding:7px 15px;border-radius:999px;border:1px solid rgba(212,184,120,.6);
      background:#fff;font-size:13px;font-weight:500;color:#5a5a6e;transition:all .18s ease;min-height:38px;}
    .chip:active{transform:scale(.96);}
    .chip-active{background:#7c2d3a;color:#faf6ef;border-color:#7c2d3a;}

    .total-bar{display:flex;align-items:center;justify-content:space-between;
      margin-top:18px;padding:14px 16px;background:#fffdf8;border:1px solid rgba(212,184,120,.42);
      border-radius:1rem;}

    /* ---- swipe ---- */
    .swipe-wrap{position:relative;border-radius:1rem;overflow:hidden;}
    .swipe-bg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 24px;
      font-size:14px;font-weight:600;border-radius:1rem;transition:opacity .15s ease;}
    .swipe-bg-left{background:#5a7a4f;color:#faf6ef;justify-content:flex-start;}
    .swipe-bg-right{background:#d97706;color:#faf6ef;justify-content:flex-end;}

    /* ---- onglets ---- */
    .top-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:.8rem;
      font-size:14px;font-weight:500;color:#5a5a6e;transition:all .18s ease;min-height:42px;}
    .top-tab:hover{background:rgba(124,45,58,.06);}
    .top-tab-active{background:rgba(124,45,58,.1);color:#7c2d3a;}
    .bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
      background:rgba(255,253,248,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-top:1px solid rgba(212,184,120,.5);padding-bottom:env(safe-area-inset-bottom);}
    .bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:500;color:#5a5a6e;min-height:60px;
      transition:color .15s ease;}
    .bottom-tab:active{transform:scale(.94);}
    .bottom-tab-active{color:#7c2d3a;}

    /* ---- FAB ---- */
    .fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:35;
      width:64px;height:64px;border-radius:999px;background:#7c2d3a;color:#faf6ef;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 24px rgba(124,45,58,.4),0 2px 6px rgba(124,45,58,.3);
      transition:transform .14s ease-out,background-color .2s ease;}
    .fab:active{transform:scale(.93);background:#5a1f2a;}

    /* ---- pull to refresh ---- */
    .ptr-indicator{display:flex;align-items:center;justify-content:center;overflow:hidden;
      color:#b8924a;position:relative;z-index:5;}

    /* ---- modale ---- */
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(26,34,56,.45);
      backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;
      align-items:flex-end;justify-content:center;animation:fadein .2s ease-out;}
    @media(min-width:768px){.modal-backdrop{align-items:center;padding:24px;}}
    .modal-panel{background:#faf6ef;display:flex;flex-direction:column;width:100%;}
    .modal-panel-mobile{border-radius:1.4rem 1.4rem 0 0;max-height:93vh;animation:slideup .3s ease-out;
      padding-bottom:env(safe-area-inset-bottom);}
    .modal-panel-centered{max-width:600px;border-radius:1.3rem;max-height:88vh;
      animation:popin .25s ease-out;box-shadow:0 24px 60px rgba(26,34,56,.3);}
    @media(min-width:1024px){.modal-panel-centered{max-width:680px;}}
    .drag-handle{width:42px;height:4px;border-radius:999px;background:rgba(90,90,110,.28);
      margin:10px auto 2px;flex-shrink:0;}
    .modal-body{flex:1;overflow-y:auto;padding-top:4px;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
    .modal-footer{flex-shrink:0;}
    .action-sheet{background:#faf6ef;width:100%;border-radius:1.4rem 1.4rem 0 0;
      animation:slideup .3s ease-out;padding-bottom:env(safe-area-inset-bottom);
      max-width:560px;}
    @keyframes fadein{from{opacity:0;}to{opacity:1;}}
    @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
    @keyframes popin{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

    /* ---- toggle ---- */
    .toggle{width:46px;height:27px;border-radius:999px;background:rgba(90,90,110,.28);
      position:relative;transition:background-color .2s ease;flex-shrink:0;}
    .toggle-on{background:#5a7a4f;}
    .toggle-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:999px;
      background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s ease;}
    .toggle-on .toggle-knob{transform:translateX(19px);}

    /* ---- toasts ---- */
    .toast-wrap{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;flex-direction:column;
      align-items:center;gap:8px;padding:12px;pointer-events:none;}
    .toast-item{pointer-events:auto;width:100%;max-width:440px;background:#faf6ef;
      border:1px solid #b8924a;border-left:3px solid #b8924a;border-radius:13px;
      padding:12px 14px;display:flex;gap:10px;align-items:flex-start;color:#1a2238;font-size:14px;
      box-shadow:0 8px 24px rgba(124,45,58,.16);animation:toastin .25s ease-out;}
    .toast-item svg{color:#5a7a4f;}
    .toast-error{border-color:#c2410c;border-left-color:#c2410c;}
    .toast-error svg{color:#c2410c;}
    .toast-info{border-color:#b8924a;border-left-color:#b8924a;}
    .toast-info svg{color:#8a6c34;}
    @keyframes toastin{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

    /* ---- confetti ---- */
    .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden;}
    .confetti-piece{position:absolute;top:-24px;border-radius:1px;
      animation-name:confettifall;animation-timing-function:cubic-bezier(.3,.1,.5,1);animation-fill-mode:forwards;}
    @keyframes confettifall{0%{transform:translate(0,0) rotate(0);opacity:1;}
      100%{transform:translate(var(--drift),112vh) rotate(var(--rot));opacity:.85;}}

    /* ---- bandeau installation ---- */
    .install-banner{position:fixed;left:0;right:0;z-index:45;background:#fffdf8;
      border-top:1px solid rgba(212,184,120,.6);padding:12px 14px;
      box-shadow:0 -6px 20px rgba(124,45,58,.1);
      bottom:calc(60px + env(safe-area-inset-bottom));}
    @media(min-width:768px){.install-banner{bottom:0;max-width:520px;left:auto;right:18px;
      border:1px solid rgba(212,184,120,.6);border-radius:1rem;margin-bottom:18px;}}

    /* ---- lueur de connexion ---- */
    .login-glow{position:absolute;top:-10%;left:50%;transform:translateX(-50%);
      width:120vw;max-width:760px;height:60vh;pointer-events:none;
      background:radial-gradient(ellipse at center,rgba(184,146,74,.16),transparent 70%);}
  </style>
</head>
